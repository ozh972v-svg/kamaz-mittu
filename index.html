<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гарантийная работа КАМАЗ — тест (демо)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  }

    height: 100%; background: #2563eb; transition: width 0.3s ease;
  }

  .section-label {

  }
  .badge.multi { background: #fef3c7; color: #b45309; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;

    margin-bottom: 10px; cursor: pointer; transition: all 0.15s;
    user-select: none;
  }
  .option:active { transform: scale(0.99); }
  .option.selected { border-color: #2563eb; background: #eff6ff; }
  .option.correct-answer { border-color: #16a34a; background: #f0fdf4; }
  .option.missed-answer { border-color: #f59e0b; background: #fffbeb; }
  .option.wrong-answer { border-color: #dc2626; background: #fef2f2; }
  .option.correct-answer span,
  .option.missed-answer span { color: #16a34a; font-weight: 600; }

  .option input { margin-top: 3px; flex-shrink: 0; }
  .option span { font-size: 15px; }
  .btn {
    display: block; width: 100%; padding: 14px; border: none;

    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary:active:not(:disabled) { opacity: 0.85; }
  .btn-secondary { background: #fff; color: #2563eb; border: 1.5px solid #2563eb; }
  .btn-secondary:active { opacity: 0.85; }
  .btn-warn { background: #fff; color: #b45309; border: 1.5px solid #f59e0b; }
  .btn-warn:active { opacity: 0.85; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .result-score {

  }
  .result-score.pass { color: #16a34a; }
  .result-score.fail { color: #dc2626; }
  .result-label { text-align: center; color: #666; font-size: 15px; margin-bottom: 20px; }
  .stat-row {
    display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid #f0f0f0; font-size: 15px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row b { color: #2563eb; }
  .feedback {
    margin-top: 16px; padding: 14px; border-radius: 10px;
  }
  .feedback-correct { background: #f0fdf4; border-left: 4px solid #16a34a; }
  .feedback-wrong { background: #fef2f2; border-left: 4px solid #dc2626; }
  .feedback-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .feedback-correct .feedback-title { color: #16a34a; }
  .feedback-wrong .feedback-title { color: #dc2626; }
  .feedback-row { font-size: 14px; margin: 4px 0; }
  .source-block {
    background: #fffbeb; border-left: 4px solid #f59e0b;
    padding: 12px 14px; border-radius: 8px; margin-top: 12px;
    font-size: 13px; color: #444;

  .source-block .source-title {
    font-weight: 700; color: #b45309; margin-bottom: 6px; font-size: 13px;
  }

    grid-template-columns: 1fr 220px;
    gap: 20px;
  }
  @media (max-width: 720px) {
    .question-layout { grid-template-columns: 1fr; }
  }
  .chart-box {
    background: #f9fafb;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    position: sticky;
    top: 16px;
    align-self: start;
  }
  .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: #555;

  }

    height: 140px;

  .donut-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);

    font-weight: 700;
    color: #16a34a;
  }
  .chart-legend {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    text-align: left;
    margin-top: 8px;
  }
  .chart-legend-row {
    display: flex;
    justify-content: space-between;

  }

  .menu-btn {
    display: block; width: 100%; padding: 18px;

    text-align: left;

  .menu-btn:hover { background: #eff6ff; }
  .menu-btn .menu-btn-sub {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: #666;
    margin-top: 4px;
  }
  .section-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fff;
    transition: all 0.15s;
  }

  .section-item-name { font-weight: 600; font-size: 15px; }
  .section-item-count {
    font-size: 13px;
    color: #2563eb;
    background: #eff6ff;
    padding: 2px 10px;

  .question-list-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 8px;

    transition: all 0.15s;

  .question-list-text {
    font-size: 14px;
    flex: 1;
  }
  .question-list-status {
    flex-shrink: 0;
    font-size: 18px;

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;

  .exit-bar {
    display: flex; justify-content: flex-end; margin-bottom: 10px;
  }
  .exit-bar button {
    background: transparent; border: none;

</head>
<body>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const PASS_THRESHOLD = 70;

// Хранилище прогресса
const STORAGE_KEY = 'kamaz_test_progress_v1';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function saveProgress(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
}

function clearProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// Банк вопросов (демо — 10 шт)
const QUESTION_BANK = [
  {
    type: "single",
    section: "1. Гарантия на автотехнику",
    ref: "слайд «Гарантия на АКБ»",
    source: "Гарантия на АКБ 12 мес. без ограничения пробега автотехники, но не более 24 мес. с даты изготовления АКБ",
    q: "Какой срок гарантии на АКБ?",
    options: [
      "6 месяцев без ограничения пробега",

      "24 месяца с даты установки",
      "36 месяцев"
    ],
    correct: [1]
  },
  {
    type: "single",
    section: "1. Гарантия на автотехнику",
    ref: "слайд «Гарантия на шины»",
    source: "Гарантия на шины <24 мес. или пробег гарантии на автотехнику в зависимости от того, что наступит раньше.",
    q: "Какой срок гарантии на шины?",
    options: [
      "12 месяцев",
      "24 месяца или пробег гарантии на автотехнику — что наступит раньше",
      "36 месяцев",
      "Без ограничений"
    ],
    correct: [1]
  },
  {
    type: "single",
    section: "2. Гарантия на запасные части",
    ref: "слайд «Гарантия на запасные части»",
    source: "Гарантия на запасные части производства ПАО «КАМАЗ»: 12 мес. или 50 тыс. км с момента установки.",
    q: "Какой гарантийный срок на запасные части производства ПАО «КАМАЗ»?",
    options: [
      "6 месяцев или 30 тыс. км",
      "12 месяцев или 50 тыс. км с момента установки",
      "24 месяца или 100 тыс. км",
      "Без ограничений"
    ],
    correct: [1]
  },
  {
    type: "single",
    section: "2. Гарантия на запасные части",
    ref: "слайд «Гарантия на запасные части»",
    source: "Гарантия на запасные части производства заводов-смежников ПАО «КАМАЗ»: 12 мес. или 100 тыс. км с момента установки.",
    q: "Какой гарантийный срок на запасные части производства заводов-смежников?",
    options: [
      "6 месяцев или 30 тыс. км",
      "12 месяцев или 50 тыс. км",
      "12 месяцев или 100 тыс. км с момента установки",
      "24 месяца"
    ],
    correct: [2]
  },
  {
    type: "single",
    section: "3. Регистрация даты начала гарантии",
    ref: "слайд «Регистрация даты начала гарантии»",
    source: "Реализация автотехники через дилера — дата передачи автотехники первым дилером / партнёром третьему лицу. Документ — акт приёма-передачи между первым дилером и третьим лицом.",
    q: "С какой даты начинается гарантийный срок при реализации автотехники через дилера?",
    options: [
      "С даты изготовления на заводе",
      "С даты передачи первым дилером третьему лицу (акт приёма-передачи)",
      "С даты постановки на учёт в ГИБДД",
      "С даты первого ТО"
    ],
    correct: [1]
  },
  {
    type: "single",
    section: "3. Регистрация даты начала гарантии",
    ref: "слайд «Регистрация даты начала гарантии»",
    source: "Искл.: Реализация автотехники субъекту МЧС РФ — дата ввода автотехники в эксплуатацию. Документ — приказ командира части.",
    q: "С какой даты начинается гарантия для автотехники, поставленной МЧС РФ?",
    options: [
      "С даты реализации",
      "С даты ввода в эксплуатацию (приказ командира части)",
      "С даты изготовления",
      "С даты подписания договора"
    ],
    correct: [1]
  },
  {
    type: "single",
    section: "4. Восстановление автотехники",
    ref: "слайд «Восстановление автотехники»",
    source: "Целевой показатель ≤ 5 календарных дней.",
    q: "Каков целевой показатель срока восстановления автотехники?",
    options: [
      "Не более 3 календарных дней",
      "Не более 5 календарных дней",
      "Не более 10 календарных дней",
      "Не более 30 дней"
    ],
    correct: [1]
  },
  {
    type: "single",
    section: "4. Восстановление автотехники",
    ref: "слайд «Восстановление автотехники»",
    source: "Использование неоригинальных запасных частей допускается только при согласовании ООО «АвтоЗапчасть КАМАЗ» (на prs@kamaz.ru письмо на официальном бланке сервисного центра с запросом и приложением счёта на оплату).",
    q: "Как согласовать использование неоригинальных запасных частей при гарантийном ремонте?",
    options: [
      "Никак — запрещено",
      "Письмом на prs@kamaz.ru на официальном бланке СЦ с запросом и счётом на оплату",
      "Устно по телефону АЗК",
      "По решению потребителя"
    ],
    correct: [1]
  },
  {
    type: "single",
    section: "5. Предварительное одобрение",
    ref: "слайд «Предварительное одобрение»",
    source: "Стоимость ремонта не менее 200 тыс. руб. Не более 4 в месяц от СЦ.",
    q: "При какой минимальной стоимости ремонта требуется предварительное одобрение?",
    options: [
      "Более 50 тыс. руб.",
      "Более 100 тыс. руб.",
      "Не менее 200 тыс. руб.",
      "Более 500 тыс. руб."
    ],
    correct: [2]
  },
  {
    type: "single",
    section: "5. Предварительное одобрение",
    ref: "слайд «Предварительное одобрение»",
    source: "Не более 4 в месяц от СЦ рекламационных актов для предварительного одобрения.",
    q: "Сколько рекламационных актов в месяц СЦ может подать на предварительное одобрение?",
    options: ["Не более 2", "Не более 4", "Не более 10", "Без ограничений"],
    correct: [1]
  }
];
 // ===================== ЛОГИКА =====================

const app = document.getElementById('app');
let state = {
  screen: 'menu',           // menu | sections | sectionQuestions | quiz | results | questionView
  quiz: [],                 // массив вопросов текущего теста
  answers: [],              // ответы пользователя по индексам теста (null | массив индексов)
  answered: [],             // показан ли разбор
  skipped: [],              // пропущен ли вопрос
  current: 0,               // текущий вопрос
  sectionKey: null,         // выбранный раздел в оглавлении
  viewQuestionIdx: null,    // индекс вопроса для просмотра из оглавления
  // прогресс по каждому вопросу банка (для оглавления)
  progress: loadProgress() || {}
};

// ===== УТИЛИТЫ =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getMainSection(section) {
  const m = section.match(/^(\d+)/);
  return m ? m[1] : "999";
}

function sectionOrder(section) {
  const m = section.match(/^(\d+)\.(\d+)/);
  if (!m) return [999, 999];
  return [parseInt(m[1]), parseInt(m[2])];
}

function arraysEqual(a, b) {
  if (!a || !b) return false;
  if (a.length !== b.length) return false;
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Ключ для прогресса: section + q (текст вопроса уникален)
function qKey(q) {
  return q.section + '::' + q.q;
}

// Получить статус вопроса из прогресса
function getQuestionStatus(q) {
  return state.progress[qKey(q)] || null;
}

// Сохранить статус вопроса
function setQuestionStatus(q, status) {
  state.progress[qKey(q)] = status; // 'correct' | 'wrong' | 'skipped'
  saveProgress(state.progress);
}

// Перемешать варианты ответа
function shuffleOptions(q) {
  const indices = q.options.map((_, i) => i);
  const shuffledIdx = shuffle(indices);
  const newOptions = shuffledIdx.map(i => q.options[i]);
  const newCorrect = q.correct.map(c => shuffledIdx.indexOf(c));
  return { ...q, options: newOptions, correct: newCorrect };
}

// ===================== ЭКРАНЫ =====================

function renderMenu() {
  state.screen = 'menu';
  const total = QUESTION_BANK.length;
  const answeredCount = Object.keys(state.progress).length;
  const correctCount = Object.values(state.progress).filter(s => s === 'correct').length;

  app.innerHTML = `
    <div class="card">
      <h1>Гарантийная работа с автотехникой КАМАЗ</h1>
      <p class="subtitle">Демо-версия · ${total} вопросов в банке</p>
      <button class="menu-btn" id="btnQuiz">
        Начать тест
        <span class="menu-btn-sub">Случайные вопросы · пропуск · диаграмма результата</span>
      </button>
      <button class="menu-btn" id="btnSections">
        По разделам
        <span class="menu-btn-sub">Изучать вопросы по темам, смотреть свои ответы</span>
      </button>
      ${answeredCount > 0 ? `
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid #eee;font-size:14px;color:#666;">
          <div>Прогресс: <b style="color:#2563eb;">${answeredCount}</b> из ${total} вопросов отвечено</div>
          <div>Правильных: <b style="color:#16a34a;">${correctCount}</b></div>
          <button class="back-btn" id="btnReset" style="margin-top:10px;color:#dc2626;">Сбросить прогресс</button>
        </div>
      ` : ''}
    </div>
  `;

  document.getElementById('btnQuiz').onclick = startQuiz;
  document.getElementById('btnSections').onclick = () => { state.screen = 'sections'; renderSections(); };
  const rst = document.getElementById('btnReset');
  if (rst) rst.onclick = () => {
    if (confirm('Сбросить весь прогресс?')) {
      state.progress = {};
      clearProgress();
      renderMenu();
    }
  };
}

// Группировка вопросов по разделам
function getSections() {
  const map = new Map();
  QUESTION_BANK.forEach(q => {
    if (!map.has(q.section)) map.set(q.section, []);
    map.get(q.section).push(q);
  });
  // Сортируем по порядку
  const arr = Array.from(map.entries()).map(([name, items]) => ({ name, items }));
  arr.sort((a, b) => {
    const [a1, a2] = sectionOrder(a.name);
    const [b1, b2] = sectionOrder(b.name);
    if (a1 !== b1) return a1 - b1;
    return a2 - b2;
  });
  return arr;
}

function renderSections() {
  state.screen = 'sections';
  const sections = getSections();

  let html = `
    <div class="card">
      <button class="back-btn" id="backBtn">← В меню</button>
      <h2>Разделы</h2>
      <p class="subtitle">Всего разделов: ${sections.length}</p>
  `;

  sections.forEach((s, idx) => {
    const answeredInSection = s.items.filter(q => getQuestionStatus(q)).length;
    html += `
      <div class="section-item" data-idx="${idx}">
        <div>
          <div class="section-item-name">${s.name}</div>
          ${answeredInSection > 0 ? `<div style="font-size:12px;color:#16a34a;margin-top:4px;">Отвечено: ${answeredInSection} из ${s.items.length}</div>` : ''}
        </div>
        <div class="section-item-count">${s.items.length}</div>
      </div>
    `;
  });

  html += `</div>`;
  app.innerHTML = html;

  document.getElementById('backBtn').onclick = () => renderMenu();
  document.querySelectorAll('.section-item').forEach(el => {
    el.onclick = () => {
      state.sectionKey = sections[parseInt(el.dataset.idx)].name;
      state.screen = 'sectionQuestions';
      renderSectionQuestions();
    };
  });
}

function renderSectionQuestions() {
  const sections = getSections();
  const sec = sections.find(s => s.name === state.sectionKey);
  if (!sec) { renderSections(); return; }

  let html = `
    <div class="card">
      <button class="back-btn" id="backBtn">← К разделам</button>
      <h2>${sec.name}</h2>
      <p class="subtitle">Вопросов: ${sec.items.length}</p>
  `;

  sec.items.forEach((q, idx) => {
    const status = getQuestionStatus(q);
    let statusIcon = '<span class="status-none">○</span>';
    if (status === 'correct') statusIcon = '<span class="status-correct">✓</span>';
    else if (status === 'wrong') statusIcon = '<span class="status-wrong">✗</span>';
    else if (status === 'skipped') statusIcon = '<span class="status-skipped">—</span>';

    html += `
      <div class="question-list-item" data-idx="${idx}">
        <div class="question-list-text">${q.q}</div>
        <div class="question-list-status">${statusIcon}</div>
      </div>
    `;
  });

  html += `</div>`;
  app.innerHTML = html;

  document.getElementById('backBtn').onclick = () => renderSections();
  document.querySelectorAll('.question-list-item').forEach(el => {
    el.onclick = () => {
      state.viewQuestionIdx = parseInt(el.dataset.idx);
      state.screen = 'questionView';
      renderQuestionView();
    };
  });
}

function renderQuestionView() {
  const sections = getSections();
  const sec = sections.find(s => s.name === state.sectionKey);
  const q = sec.items[state.viewQuestionIdx];

  let html = `
    <div class="card">
      <button class="back-btn" id="backBtn">← К разделу</button>
      <div class="section-label">${q.section} · ${q.ref}</div>
      <span class="badge ${q.type === 'multi' ? 'multi' : ''}">${q.type === 'multi' ? 'Несколько ответов' : 'Один ответ'}</span>
      <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    const isCorr = q.correct.includes(i);
    let cls = 'option';
    let mark = '';
    if (isCorr) { cls += ' correct-answer'; mark = ' ✓'; }
    html += `
      <div class="${cls}">
        <span>${opt}${mark}</span>
      </div>
    `;
  });

  html += `
      <div class="feedback feedback-correct">
        <div class="feedback-title">✅ Правильный ответ</div>
        <div class="feedback-row"><b>Правильно:</b> ${q.correct.map(x => '«' + q.options[x] + '»').join(', ')}</div>
        <div class="source-block" style="margin-top:12px;">
          <div class="source-title">📖 Источник в документе</div>
          <div class="source-ref">${q.section} · ${q.ref}</div>
          <div class="source-text">«${q.source}»</div>
        </div>
      </div>
    </div>
  `;
  app.innerHTML = html;

  document.getElementById('backBtn').onclick = () => {
    state.screen = 'sectionQuestions';
    renderSectionQuestions();
  };
}

// ===================== ТЕСТ =====================

const QUIZ_SIZE = 10; // для демо
const PRIORITY_WEIGHT = 0.6;

function isPriority(q) {
  const s = getMainSection(q.section);
  return s === '3' || s === '4';
}

function buildQuiz() {
  const priority = QUESTION_BANK.filter(isPriority);
  const normal = QUESTION_BANK.filter(q => !isPriority(q));

  const priorityCount = Math.round(QUIZ_SIZE * PRIORITY_WEIGHT);
  const normalCount = QUIZ_SIZE - priorityCount;

  function pickFromGroup(group, count) {
    const groups = [];
    let currentKey = null;
    let currentGroup = null;
    const sorted = [...group].sort((a, b) => {
      const [a1, a2] = sectionOrder(a.section);
      const [b1, b2] = sectionOrder(b.section);
      if (a1 !== b1) return a1 - b1;
      return a2 - b2;
    });
    sorted.forEach(q => {
      if (q.section !== currentKey) {
        if (currentGroup) groups.push(currentGroup);
        currentKey = q.section;
        currentGroup = { key: q.section, items: [] };
      }
      currentGroup.items.push(q);
    });
    if (currentGroup) groups.push(currentGroup);

    const numGroups = groups.length;
    const base = Math.floor(count / numGroups);
    const rem = count - base * numGroups;

    groups.forEach(g => { g.items = shuffle(g.items); });

    const taken = [];
    groups.forEach((g, idx) => {
      const want = base + (idx < rem ? 1 : 0);
      const take = Math.min(want, g.items.length);
      taken.push({ group: g, take });
    });

    let total = taken.reduce((s, t) => s + t.take, 0);
    if (total < count) {
      const leftovers = [];
      taken.forEach((t, gi) => {
        const remaining = groups[gi].items.slice(t.take);
        remaining.forEach(item => leftovers.push({ gi, item }));
      });
      const sh = shuffle(leftovers);
      for (const lo of sh) {
        if (total >= count) break;
        taken[lo.gi].take += 1;
        total++;
      }
    }

    const result = [];
    taken.forEach((t, gi) => {
      const items = groups[gi].items.slice(0, t.take);
      result.push(...items);
    });
    return result;
  }

  let selected = pickFromGroup(priority, priorityCount);
  let normalSelected = pickFromGroup(normal, normalCount);

  if (selected.length < priorityCount) {
    const deficit = priorityCount - selected.length;
    normalSelected = pickFromGroup(normal, normalCount + deficit);
  }
  if (normalSelected.length < normalCount) {
    const deficit = normalCount - normalSelected.length;
    selected = pickFromGroup(priority, priorityCount + deficit);
  }

  const all = [...selected, ...normalSelected];
  all.sort((a, b) => {
    const [a1, a2] = sectionOrder(a.section);
    const [b1, b2] = sectionOrder(b.section);
    if (a1 !== b1) return a1 - b1;
    return a2 - b2;
  });
  return all.slice(0, QUIZ_SIZE);
}

function startQuiz() {
  const raw = buildQuiz();
  state.quiz = raw.map(shuffleOptions);
  state.answers = state.quiz.map(() => null);
  state.answered = state.quiz.map(() => false);
  state.skipped = state.quiz.map(() => false);
  state.current = 0;
  state.screen = 'quiz';
  renderQuiz();
}

function renderQuiz() {
  const q = state.quiz[state.current];
  const selected = state.answers[state.current] || [];
  const isAnswered = state.answered[state.current];
  const isSkipped = state.skipped[state.current];

  // Считаем статистику для диаграммы
  let correctCount = 0, wrongCount = 0, skippedCount = 0;
  state.quiz.forEach((qq, i) => {
    if (state.answered[i]) {
      const userAns = state.answers[i] || [];
      if (arraysEqual(userAns, qq.correct)) correctCount++;
      else wrongCount++;
    } else if (state.skipped[i]) {
      skippedCount++;
    }
  });
  const totalProcessed = correctCount + wrongCount + skippedCount;
  const percentCorrect = totalProcessed > 0 ? Math.round(correctCount / totalProcessed * 100) : 0;
  const percentWrong = totalProcessed > 0 ? Math.round(wrongCount / totalProcessed * 100) : 0;
  const percentSkipped = totalProcessed > 0 ? 100 - percentCorrect - percentWrong : 0;

  // Круговая диаграмма
  const R = 60;
  const C = 2 * Math.PI * R;
  const dashCorrect = (percentCorrect / 100) * C;
  const dashWrong = (percentWrong / 100) * C;
  const dashSkipped = (percentSkipped / 100) * C;
  const offsetWrong = -dashCorrect;
  const offsetSkipped = -(dashCorrect + dashWrong);

  let html = `
    <div class="card">
      <div class="exit-bar">
        <button id="exitBtn">Выйти</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${((state.current)/state.quiz.length)*100}%"></div>
      </div>
      <div class="progress-text">Вопрос ${state.current + 1} из ${state.quiz.length}${isSkipped ? ' · пропущен' : ''}</div>
      <div class="question-layout">
        <div>
          <div class="section-label">${q.section} · ${q.ref}</div>
          <span class="badge ${q.type === 'multi' ? 'multi' : ''}">${q.type === 'multi' ? 'Несколько ответов' : 'Один ответ'}</span>
          <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    const isSel = selected.includes(i);
    const isCorr = q.correct.includes(i);
    let cls = 'option';
    let mark = '';
    if (isAnswered) {
      if (isCorr && isSel) { cls += ' correct-answer'; mark = ' ✓'; }
      else if (isCorr && !isSel) { cls += ' missed-answer'; mark = ' ✓ (пропущено)'; }
      else if (!isCorr && isSel) { cls += ' wrong-answer'; mark = ' ✗'; }
    } else {
      if (isSel) cls += ' selected';
    }
    html += `
      <label class="${cls}" data-idx="${i}">
        <input type="${q.type === 'multi' ? 'checkbox' : 'radio'}" name="q" ${isSel ? 'checked' : ''} ${isAnswered ? 'disabled' : ''}>
        <span>${opt}${mark}</span>
      </label>
    `;
  });

  if (isAnswered) {
    const isCorrect = arraysEqual(selected, q.correct);
    html += `
      <div class="feedback ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}">
        <div class="feedback-title">${isCorrect ? '✅ Верно' : '❌ Ошибка'}</div>
        ${!isCorrect ? `
          <div class="feedback-row"><b>Ваш ответ:</b> ${selected.length ? selected.map(x => '«' + q.options[x] + '»').join(', ') : '— не отвечено —'}</div>
          <div class="feedback-row"><b>Правильно:</b> ${q.correct.map(x => '«' + q.options[x] + '»').join(', ')}</div>
        ` : ''}
        <div class="source-block" style="margin-top:12px;">
          <div class="source-title">📖 Источник в документе</div>
          <div class="source-ref">${q.section} · ${q.ref}</div>
          <div class="source-text">«${q.source}»</div>
        </div>
      </div>
    `;
  }

  html += `</div>`; // конец левой колонки

  // Правая колонка — диаграмма
  html += `
        <div>
          <div class="chart-box">
            <div class="chart-title">Ваш прогресс</div>
            <div class="donut">
              <svg width="140" height="140" viewBox="0 0 140 140">
                <circle cx="70" cy="70" r="${R}" fill="none" stroke="#e5e7eb" stroke-width="16"/>
                ${percentCorrect > 0 ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="#16a34a" stroke-width="16" stroke-dasharray="${dashCorrect} ${C}" stroke-dashoffset="0"/>` : ''}
                ${percentWrong > 0 ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="#dc2626" stroke-width="16" stroke-dasharray="${dashWrong} ${C}" stroke-dashoffset="${offsetWrong}"/>` : ''}
                ${percentSkipped > 0 ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="#9ca3af" stroke-width="16" stroke-dasharray="${dashSkipped} ${C}" stroke-dashoffset="${offsetSkipped}"/>` : ''}
              </svg>
              <div class="donut-center" style="color:${percentCorrect >= 70 ? '#16a34a' : (percentCorrect >= 40 ? '#b45309' : '#dc2626')}">${percentCorrect}%</div>
            </div>
            <div class="chart-legend">
              <div class="chart-legend-row"><span><span class="chart-dot dot-correct"></span>Верно</span><b>${correctCount}</b></div>
              <div class="chart-legend-row"><span><span class="chart-dot dot-wrong"></span>Ошибки</span><b>${wrongCount}</b></div>
              <div class="chart-legend-row"><span><span class="chart-dot dot-skipped"></span>Пропущено</span><b>${skippedCount}</b></div>
            </div>
          </div>
        </div>
      </div>
  `;

  // Кнопки
  let buttons = '<div class="btn-row">';
  if (!isAnswered) {
    buttons += `<button class="btn btn-secondary" id="skipBtn">Пропустить</button>`;
    buttons += `<button class="btn btn-primary" id="answerBtn" ${selected.length === 0 ? 'disabled' : ''}>Ответить</button>`;
  } else {
    if (state.current === state.quiz.length - 1) {
      buttons += `<button class="btn btn-primary" id="finishBtn">Завершить тест</button>`;
    } else {
      buttons += `<button class="btn btn-primary" id="nextBtn">Далее</button>`;
    }
  }
  buttons += '</div>';
  html += buttons;

  html += `</div>`; // конец card
  app.innerHTML = html;

  // Слушатели
  document.querySelectorAll('.option').forEach(el => {
    el.onclick = (e) => {
      if (state.answered[state.current]) return;
      e.preventDefault();
      const idx = parseInt(el.dataset.idx);
      let sel = [...(state.answers[state.current] || [])];
      if (q.type === 'multi') {
        if (sel.includes(idx)) sel = sel.filter(x => x !== idx);
        else sel.push(idx);
      } else {
        sel = [idx];
      }
      state.answers[state.current] = sel;
      state.skipped[state.current] = false;
      renderQuiz();
    };
  });

  document.getElementById('exitBtn').onclick = () => {
    if (confirm('Выйти из теста? Прогресс сохранится.')) {
      renderMenu();
    }
  };

  const skipBtn = document.getElementById('skipBtn');
  if (skipBtn) skipBtn.onclick = () => {
    state.skipped[state.current] = true;
    // отмечаем в общем прогрессе как пропущенный
    setQuestionStatus(q, 'skipped');
    if (state.current < state.quiz.length - 1) {
      state.current++;
      renderQuiz();
    } else {
      // ищем пропущенные
      const firstSkipped = state.skipped.findIndex((s, i) => s && !state.answered[i]);
      if (firstSkipped !== -1) {
        state.current = firstSkipped;
        renderQuiz();
      } else {
        renderResults();
      }
    }
  };

  const answerBtn = document.getElementById('answerBtn');
  if (answerBtn) answerBtn.onclick = () => {
    state.answered[state.current] = true;
    state.skipped[state.current] = false;
    // сохраняем в прогресс
    const userAns = state.answers[state.current] || [];
    const isCorrect = arraysEqual(userAns, q.correct);
    setQuestionStatus(q, isCorrect ? 'correct' : 'wrong');
    renderQuiz();
  };

  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.onclick = () => {
    if (state.current < state.quiz.length - 1) {
      state.current++;
      renderQuiz();
    } else {
      // если есть пропущенные — вернуться к ним
      const firstSkipped = state.skipped.findIndex((s, i) => s && !state.answered[i]);
      if (firstSkipped !== -1) {
        state.current = firstSkipped;
        renderQuiz();
      } else {
        renderResults();
      }
    }
  };

  const finishBtn = document.getElementById('finishBtn');
  if (finishBtn) finishBtn.onclick = () => {
    const hasSkipped = state.skipped.some((s, i) => s && !state.answered[i]);
    const hasUnanswered = state.answered.some((a, i) => !a && !state.skipped[i]);
    if (hasSkipped || hasUnanswered) {
      if (!confirm('Есть пропущенные вопросы. Завершить тест?')) return;
    }
    renderResults();
  };
}

function renderResults() {
  let correctCount = 0, wrongCount = 0, skippedCount = 0;
  state.quiz.forEach((q, i) => {
    if (state.answered[i]) {
      if (arraysEqual(state.answers[i], q.correct)) correctCount++;
      else wrongCount++;
    } else {
      skippedCount++;
    }
  });

  const answeredTotal = correctCount + wrongCount;
  const percent = answeredTotal > 0 ? Math.round(correctCount / answeredTotal * 100) : 0;
  const pass = percent >= PASS_THRESHOLD;

  let html = `
    <div class="card">
      <h1>Результат</h1>
      <div class="result-score ${pass ? 'pass' : 'fail'}">${percent}%</div>
      <div class="result-label">${pass ? '✅ Тест пройден' : '❌ Тест не пройден'} (порог ${PASS_THRESHOLD}%)</div>
      <div class="stat-row"><span>Всего вопросов</span><b>${state.quiz.length}</b></div>
      <div class="stat-row"><span>Правильных</span><b style="color:#16a34a;">${correctCount}</b></div>
      <div class="stat-row"><span>Ошибок</span><b style="color:#dc2626;">${wrongCount}</b></div>
      <div class="stat-row"><span>Пропущено</span><b style="color:#9ca3af;">${skippedCount}</b></div>
      <div class="stat-row"><span>Процент считается от</span><b>${answeredTotal} отвеченных</b></div>
    </div>
    <button class="btn btn-primary" onclick="location.reload()">Пройти заново</button>
    <button class="btn btn-secondary" style="margin-top:10px;" onclick="window.location.href='#menu'; location.reload();">В главное меню</button>
  `;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ===================== СТАРТ =====================
renderMenu();
</script>
</body>
</html>
